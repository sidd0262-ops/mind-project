<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마음프로젝트 | 문화를 넘어 마음을 돌봅니다</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        /* 기본 초기화 및 폰트 설정 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            color: #1d1d1f;
            background-color: #ffffff;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .highlight { color: #0071e3; }

        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 0 20px;
        }

        section {
            padding: 120px 0;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s ease, transform 1s ease;
        }
        
        section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 네비게이션 */
        nav {
            padding: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f5f5f7;
        }
        nav .logo {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        nav a {
            text-decoration: none;
            color: #1d1d1f;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* 히어로 섹션 */
        .hero {
            text-align: center;
            padding: 160px 0 120px;
        }
        .hero h1 {
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 20px;
        }
        .hero p {
            font-size: 1.5rem;
            color: #86868b;
            font-weight: 400;
            letter-spacing: -0.5px;
        }

        /* 공통 제목 */
        h2 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 20px;
            text-align: center;
        }
        .desc {
            font-size: 1.2rem;
            color: #86868b;
            text-align: center;
            margin-bottom: 60px;
        }

        /* 그리드 카드 (프로그램용) */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }
        .card {
            background: #fbfbfd;
            border-radius: 20px;
            padding: 40px;
            text-align: left;
        }
        .card h3 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #1d1d1f;
        }
        .card p {
            font-size: 1rem;
            color: #515154;
        }

        /* 가로형 연혁 (Timeline) 스타일 */
        .timeline-wrapper {
            position: relative;
            margin-top: 60px;
            overflow-x: auto;
            padding-bottom: 20px;
        }
        .timeline {
            display: flex;
            justify-content: space-between;
            position: relative;
            min-width: 800px;
        }
        .timeline-line {
            position: absolute;
            top: 11px;
            left: 50px;
            right: 50px;
            height: 2px;
            background-color: #e5e5ea;
            z-index: 1;
        }
        .timeline-item {
            position: relative;
            z-index: 2;
            flex: 1;
            text-align: center;
        }
        .timeline-dot {
            width: 24px;
            height: 24px;
            background-color: #0071e3;
            border: 4px solid #ffffff;
            border-radius: 50%;
            margin: 0 auto 20px;
            box-sizing: border-box;
        }
        .timeline-date {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 8px;
        }
        .timeline-content {
            font-size: 1rem;
            color: #86868b;
            padding: 0 15px;
            word-break: keep-all;
        }

        /* 팀 소개 */
        .team-info {
            text-align: center;
            font-size: 1.1rem;
            color: #515154;
        }

        /* 후원 섹션 */
        .contact-box {
            background: #0071e3;
            color: white;
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
        }
        .contact-box h2 {
            color: white;
        }
        .contact-box p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        .contact-info {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .contact-info span {
            display: block;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 3rem; }
            .hero p { font-size: 1.2rem; }
            section { padding: 80px 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <nav>
            <div class="logo">마음프로젝트</div>
            <a href="#contact">문의 및 후원</a>
        </nav>
    </div>

    <div class="container">
        <section class="hero visible">
            <h1>문화를 넘어<br><span class="highlight
